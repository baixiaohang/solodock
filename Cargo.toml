[package]
name = "solodock"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "A lightweight single-host container deployment console"
repository = "https://github.com/baixiaohang/solodock"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
argon2 = "0.5"
base64 = "0.22"
bollard = { version = "0.21", default-features = false, features = ["http", "pipe"] }
bytes = "1"
cookie = "0.18"
chrono-tz = "0.10"
futures-util = "0.3"
getrandom = "0.3"
hmac = "0.12"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rust-embed = { version = "8", optional = true, features = ["compression"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10.7"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[features]
default = []
docker-e2e = []
embed-ui = ["dep:rust-embed"]
