[package]
name = "solodock"
version = "0.1.0"
edition = "2024"
publish = false
description = "A lightweight single-host container deployment console"
repository = "https://github.com/baixiaohang/solodock"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
