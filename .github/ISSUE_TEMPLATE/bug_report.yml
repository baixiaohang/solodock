name: Bug report
description: Report a reproducible problem in a supported SoloDock setup.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SoloDock. Do not include credentials, tokens, private hostnames, or other sensitive data. Report security vulnerabilities through private vulnerability reporting instead.
  - type: input
    id: version
    attributes:
      label: SoloDock release or commit
      description: Provide a release version or full commit SHA.
      placeholder: v0.1.0 or 0123456789abcdef...
    validations:
      required: true
  - type: input
    id: ubuntu
    attributes:
      label: Ubuntu version
      placeholder: Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: docker
    attributes:
      label: Docker Engine and Compose versions
      description: Paste the sanitized output of `docker version` and `docker compose version`.
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest sequence that reliably reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs and error codes
      description: Remove credentials, cookies, secrets, hostnames, IPs, host paths, and customer data before pasting logs.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checklist
      options:
        - label: I have removed secrets and instance-specific identifiers from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
