name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  classify_push:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      merged_pr: ${{ steps.detect.outputs.merged_pr }}
    steps:
      - name: Detect a merged pull request commit
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.ref_name }}
        run: |
          pulls=$(gh api "/repos/$REPOSITORY/commits/$COMMIT_SHA/pulls")
          merged_pr=false
          head_sha=$(jq -r --arg sha "$COMMIT_SHA" --arg base "$BASE_REF" '
            [.[] | select(
              .merged_at != null and
              .merge_commit_sha == $sha and
              .base.ref == $base
            )] | first | .head.sha // empty
          ' <<<"$pulls")
          if [[ -n $head_sha ]]; then
            current_tree=$(gh api "/repos/$REPOSITORY/git/commits/$COMMIT_SHA" --jq .tree.sha)
            runs=$(gh api "/repos/$REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&status=success&head_sha=$head_sha&per_page=100")
            while read -r run_id; do
              [[ -n $run_id ]] || continue
              artifact_id=$(gh api "/repos/$REPOSITORY/actions/runs/$run_id/artifacts" --jq '
                [.artifacts[] | select(
                  .name == "solodock-validated-tree" and
                  .expired == false
                )] | first | .id // empty
              ')
              [[ -n $artifact_id ]] || continue
              gh api "/repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" \
                >"$RUNNER_TEMP/validated-tree.zip"
              validated_tree=$(unzip -p "$RUNNER_TEMP/validated-tree.zip" validated-tree | tr -d '\r\n')
              if [[ $validated_tree == "$current_tree" ]]; then
                merged_pr=true
                break
              fi
            done < <(jq -r --arg head "$head_sha" '
              .workflow_runs[] |
              select(.head_sha == $head and .conclusion == "success") |
              .id
            ' <<<"$runs")
          fi
          echo "merged_pr=$merged_pr" >>"$GITHUB_OUTPUT"

  checks:
    needs: classify_push
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    env:
      RUN_QUALITY_CHECKS: ${{ github.event_name == 'pull_request' || needs.classify_push.outputs.merged_pr != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: ${{ needs.classify_push.outputs.merged_pr == 'true' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        if: env.RUN_QUALITY_CHECKS == 'true'
        working-directory: web
      - run: npm run test
        if: env.RUN_QUALITY_CHECKS == 'true'
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: cargo fmt --check
        if: env.RUN_QUALITY_CHECKS == 'true'
      - run: cargo clippy --all-targets --all-features -- -D warnings
        if: env.RUN_QUALITY_CHECKS == 'true'
      - run: cargo test --all-targets --all-features -- --test-threads=2
        if: env.RUN_QUALITY_CHECKS == 'true'
      - run: cargo build --release --locked --features embed-ui
      - run: chmod +x scripts/smoke-embedded-http.sh && scripts/smoke-embedded-http.sh target/release/solodock
      - run: chmod +x packaging/install.sh packaging/solodock-backup packaging/solodock-restore packaging/smoke-test.sh && packaging/smoke-test.sh
      - run: chmod +x packaging/verify-unit.sh && packaging/verify-unit.sh
      - name: Measure control-plane resource baseline
        run: |
          chmod +x scripts/measure-resources.sh
          scripts/measure-resources.sh target/release/solodock "$RUNNER_TEMP/resource-report.json"
      - name: Stage package artifact
        run: |
          package="$RUNNER_TEMP/solodock-package"
          install -d "$package/docs"
          install -m 0755 target/release/solodock packaging/install.sh packaging/solodock-backup packaging/solodock-restore "$package/"
          install -m 0644 packaging/systemd/solodock.service packaging/solodock.toml.example README.md "$package/"
          install -m 0644 docs/architecture.md docs/operations.md docs/recovery.md docs/threat-model.md docs/resource-budget.md "$package/docs/"
          cp "$RUNNER_TEMP/resource-report.json" "$package/resource-report.json"
          (cd "$package" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: solodock-embedded-package
          path: |
            ${{ runner.temp }}/solodock-package
            ${{ runner.temp }}/resource-report.json
      - name: Record validated source tree
        if: github.event_name == 'pull_request'
        run: git rev-parse 'HEAD^{tree}' >"$RUNNER_TEMP/validated-tree"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: solodock-validated-tree
          path: ${{ runner.temp }}/validated-tree
          if-no-files-found: error

  docker-e2e:
    needs: classify_push
    if: ${{ always() && (github.event_name == 'pull_request' || needs.classify_push.outputs.merged_pr != 'true') }}
    runs-on: ubuntu-24.04
    services:
      docker:
        image: docker:27-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        ports:
          - 2375:2375
          - 5000:5000
        options: >-
          --privileged
          --health-cmd "docker info"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DOCKER_HOST: tcp://127.0.0.1:2375
      SOLODOCK_TEST_DOCKER_HOST: tcp://127.0.0.1:2375
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Assert Docker 27 classic image store
        run: |
          driver_status=$(docker info --format '{{json .DriverStatus}}')
          if [[ $driver_status == *io.containerd.snapshotter.v1* ]]; then
            echo "expected classic image store, got: $driver_status" >&2
            exit 1
          fi
      - run: docker pull alpine:3.20
      - run: docker pull nginx:1.27-alpine
      - run: docker pull registry:2
      - name: Run isolated Docker E2E with separate daemon sampling
        env:
          SOLODOCK_E2E_RESOURCE_REPORT: ${{ runner.temp }}/docker-e2e-resource-report.json
        run: |
          chmod +x scripts/measure-dind-daemon.sh
          scripts/measure-dind-daemon.sh '${{ job.services.docker.id }}' "$RUNNER_TEMP/docker-daemon-resource-report.json" -- \
            cargo test --features docker-e2e --test docker_e2e -- --ignored --nocapture --test-threads=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solodock-docker-e2e-resource-report
          path: |
            ${{ runner.temp }}/docker-e2e-resource-report.json
            ${{ runner.temp }}/docker-daemon-resource-report.json
          if-no-files-found: error

  docker-containerd-e2e:
    needs: classify_push
    # Temporarily disabled: the focused suite can hang after setup succeeds.
    # Re-enable only after each scenario has a bounded timeout and reliable cleanup.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      docker:
        image: docker:29.7.2-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        ports:
          - 2375:2375
        options: >-
          --privileged
          --health-cmd "docker info"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DOCKER_HOST: tcp://127.0.0.1:2375
      SOLODOCK_TEST_DOCKER_HOST: tcp://127.0.0.1:2375
      SOLODOCK_EXPECT_CONTAINERD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Assert Docker 29 containerd image store
        run: |
          driver_status=$(docker info --format '{{json .DriverStatus}}')
          if [[ $driver_status != *io.containerd.snapshotter.v1* ]]; then
            echo "expected io.containerd.snapshotter.v1, got: $driver_status" >&2
            exit 1
          fi
      - run: docker pull postgres:16-alpine
      - run: docker pull alpine:3.20
      - name: Run focused containerd identity deployment
        run: >-
          cargo test --features docker-e2e --test docker_e2e
          containerd_ --
          --ignored --nocapture --test-threads=1
