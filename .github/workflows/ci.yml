name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_docker_e2e: ${{ steps.classify.outputs.run_docker_e2e }}
    steps:
      - name: Classify Docker E2E scope
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ $EVENT_NAME == pull_request ]]; then
            run_docker_e2e=false
            changed_paths=$(gh api --paginate "/repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[] | .filename, (.previous_filename // empty)')
            while read -r path; do
              case "$path" in
                .github/workflows/ci.yml|.github/workflows/extended-ci.yml|Cargo.toml|Cargo.lock|rust-toolchain.toml|migrations/*|scripts/measure-dind-daemon.sh|src/config.rs|src/lib.rs|src/main.rs|src/api/deployments.rs|src/api/mutations.rs|src/api/streams.rs|src/api/webhooks.rs|src/app_store/*|src/compose/*|src/db/*|src/deploy/*|src/docker/*|src/domain/*|src/mutation/*|src/registry/*|src/security/*|src/system/*|src/webhook/*|tests/docker_e2e.rs|tests/support/*)
                  run_docker_e2e=true
                  break
                  ;;
              esac
            done <<<"$changed_paths"
          else
            run_docker_e2e=true
          fi

          echo "run_docker_e2e=$run_docker_e2e" >>"$GITHUB_OUTPUT"

  checks:
    needs: classify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: checks
          save-if: ${{ github.event_name == 'push' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: cargo fmt --check
      - name: Lint all non-Docker targets
        run: cargo clippy --features embed-ui --all-targets -- -D warnings
      - name: Test all non-Docker targets
        run: cargo test --features embed-ui --all-targets -- --test-threads=2
      - run: cargo build --release --locked --features embed-ui
      - run: chmod +x scripts/smoke-embedded-http.sh && scripts/smoke-embedded-http.sh target/release/solodock
      - run: chmod +x packaging/install.sh packaging/solodock-backup packaging/solodock-restore packaging/solodock-update packaging/smoke-test.sh && packaging/smoke-test.sh
      - run: chmod +x packaging/verify-unit.sh && packaging/verify-unit.sh
      - name: Measure short control-plane resource smoke
        env:
          SOLODOCK_MEASURE_WARMUP_SECONDS: "1"
          SOLODOCK_MEASURE_SAMPLE_SECONDS: "5"
        run: |
          chmod +x scripts/measure-resources.sh
          scripts/measure-resources.sh target/release/solodock "$RUNNER_TEMP/resource-report.json"
      - name: Stage package artifact
        if: github.event_name == 'push'
        run: |
          package="$RUNNER_TEMP/solodock-package"
          install -d "$package/docs"
          install -m 0755 target/release/solodock packaging/install.sh packaging/solodock-backup packaging/solodock-restore packaging/solodock-update "$package/"
          install -m 0644 packaging/systemd/solodock.service packaging/solodock.toml.example README.md "$package/"
          install -m 0644 docs/architecture.md docs/operations.md docs/recovery.md docs/threat-model.md docs/resource-budget.md "$package/docs/"
          cp "$RUNNER_TEMP/resource-report.json" "$package/resource-report.json"
          printf '%s\n' "$GITHUB_SHA" >"$package/SOURCE_SHA"
          (cd "$package" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push'
        with:
          name: solodock-embedded-package
          path: |
            ${{ runner.temp }}/solodock-package
            ${{ runner.temp }}/resource-report.json
          retention-days: 30

  docker-e2e:
    needs: [classify, checks]
    if: needs.classify.outputs.run_docker_e2e == 'true'
    runs-on: ubuntu-24.04
    services:
      docker:
        image: docker:27-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        ports:
          - 2375:2375
          - 5000:5000
        options: >-
          --privileged
          --volume ${{ github.workspace }}:${{ github.workspace }}
          --health-cmd "docker info"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DOCKER_HOST: tcp://127.0.0.1:2375
      SOLODOCK_TEST_DOCKER_HOST: tcp://127.0.0.1:2375
      SOLODOCK_E2E_SHARED_FIXTURE_ROOT: ${{ github.workspace }}/.solodock-e2e-fixtures
      SOLODOCK_E2E_STREAM_HOLD_SECONDS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: checks
          save-if: false
      - name: Lint Docker E2E target
        run: cargo clippy --features docker-e2e --test docker_e2e -- -D warnings
      - name: Assert Docker 27 classic image store
        run: |
          driver_status=$(docker info --format '{{json .DriverStatus}}')
          if [[ $driver_status == *io.containerd.snapshotter.v1* ]]; then
            echo "expected classic image store, got: $driver_status" >&2
            exit 1
          fi
      - run: docker pull alpine:3.20
      - run: docker pull nginx:1.27-alpine
      - run: docker pull nginxinc/nginx-unprivileged:1.27-alpine
      - run: docker pull registry:2
      - name: Run isolated Docker E2E with short resource smoke
        env:
          SOLODOCK_E2E_RESOURCE_REPORT: ${{ runner.temp }}/docker-e2e-resource-report.json
        run: |
          chmod +x scripts/measure-dind-daemon.sh
          scripts/measure-dind-daemon.sh '${{ job.services.docker.id }}' "$RUNNER_TEMP/docker-daemon-resource-report.json" -- \
            cargo test --features docker-e2e --test docker_e2e -- --ignored --nocapture --test-threads=2 --skip containerd_
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: solodock-docker-e2e-resource-report
          path: |
            ${{ runner.temp }}/docker-e2e-resource-report.json
            ${{ runner.temp }}/docker-daemon-resource-report.json
          if-no-files-found: error
          retention-days: 14

  docker-containerd-e2e:
    needs: [classify, checks]
    if: needs.classify.outputs.run_docker_e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      docker:
        image: docker:29.7.2-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        ports:
          - 2375:2375
        options: >-
          --privileged
          --health-cmd "docker info"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DOCKER_HOST: tcp://127.0.0.1:2375
      SOLODOCK_TEST_DOCKER_HOST: tcp://127.0.0.1:2375
      SOLODOCK_EXPECT_CONTAINERD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: checks
          save-if: false
      - name: Assert Docker 29 containerd image store
        run: |
          driver_status=$(docker info --format '{{json .DriverStatus}}')
          if [[ $driver_status != *io.containerd.snapshotter.v1* ]]; then
            echo "expected io.containerd.snapshotter.v1, got: $driver_status" >&2
            exit 1
          fi
      - run: docker pull postgres:16-alpine
      - run: docker pull alpine:3.20
      - name: Run containerd identity and compensation suite
        run: >-
          cargo test --features docker-e2e --test docker_e2e
          containerd_ --
          --ignored --nocapture --test-threads=1
