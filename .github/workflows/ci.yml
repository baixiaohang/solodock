name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features -- --test-threads=2
      - run: cargo build --release --locked --features embed-ui
      - run: chmod +x scripts/smoke-embedded-http.sh && scripts/smoke-embedded-http.sh target/release/solodock
      - run: chmod +x packaging/install.sh packaging/solodock-backup packaging/solodock-restore packaging/smoke-test.sh && packaging/smoke-test.sh
      - run: chmod +x packaging/verify-unit.sh && packaging/verify-unit.sh
      - name: Measure control-plane resource baseline
        run: |
          chmod +x scripts/measure-resources.sh
          scripts/measure-resources.sh target/release/solodock "$RUNNER_TEMP/resource-report.json"
      - name: Stage package artifact
        run: |
          package="$RUNNER_TEMP/solodock-package"
          install -d "$package/docs"
          install -m 0755 target/release/solodock packaging/install.sh packaging/solodock-backup packaging/solodock-restore "$package/"
          install -m 0644 packaging/systemd/solodock.service packaging/solodock.toml.example README.md "$package/"
          install -m 0644 docs/architecture.md docs/operations.md docs/recovery.md docs/threat-model.md docs/resource-budget.md "$package/docs/"
          cp "$RUNNER_TEMP/resource-report.json" "$package/resource-report.json"
          (cd "$package" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: solodock-embedded-package
          path: |
            ${{ runner.temp }}/solodock-package
            ${{ runner.temp }}/resource-report.json

  docker-e2e:
    runs-on: ubuntu-24.04
    services:
      docker:
        image: docker:27-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        ports:
          - 2375:2375
          - 5000:5000
        options: >-
          --privileged
          --health-cmd "docker info"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DOCKER_HOST: tcp://127.0.0.1:2375
      SOLODOCK_TEST_DOCKER_HOST: tcp://127.0.0.1:2375
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: docker pull alpine:3.20
      - run: docker pull nginx:1.27-alpine
      - run: docker pull registry:2
      - name: Run isolated Docker E2E with separate daemon sampling
        env:
          SOLODOCK_E2E_RESOURCE_REPORT: ${{ runner.temp }}/docker-e2e-resource-report.json
        run: |
          chmod +x scripts/measure-dind-daemon.sh
          scripts/measure-dind-daemon.sh '${{ job.services.docker.id }}' "$RUNNER_TEMP/docker-daemon-resource-report.json" -- \
            cargo test --features docker-e2e --test docker_e2e -- --ignored --nocapture --test-threads=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solodock-docker-e2e-resource-report
          path: |
            ${{ runner.temp }}/docker-e2e-resource-report.json
            ${{ runner.temp }}/docker-daemon-resource-report.json
          if-no-files-found: error
