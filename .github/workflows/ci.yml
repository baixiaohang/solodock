name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_core: ${{ steps.classify.outputs.run_core }}
      run_docker_e2e: ${{ steps.classify.outputs.run_docker_e2e }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read changed PR paths
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          gh api --paginate "/repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100"
          --jq '.[] | .filename, (.previous_filename // empty)'
          >"$RUNNER_TEMP/changed-paths"
      - name: Classify CI scope
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ $EVENT_NAME == pull_request ]]; then
            scripts/classify-ci-paths.sh <"$RUNNER_TEMP/changed-paths" >>"$GITHUB_OUTPUT"
          else
            printf '%s\n' 'run_core=true' 'run_docker_e2e=true' >>"$GITHUB_OUTPUT"
          fi

  web:
    needs: classify
    if: needs.classify.outputs.run_core == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run build
        working-directory: web

  rust-lint:
    needs: classify
    if: needs.classify.outputs.run_core == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: checks
          save-if: false
      - run: cargo fmt --check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Lint all non-Docker targets
        run: cargo clippy --features embed-ui --all-targets -- -D warnings

  rust-test:
    needs: classify
    if: needs.classify.outputs.run_core == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: checks
          save-if: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Test all non-Docker targets
        run: cargo test --features embed-ui --all-targets -- --test-threads=2
      - name: Cleanup filesystem recovery gates
        run: cargo test --features docker-e2e --test m3_api storage_cleanup_ -- --test-threads=2

  package-smoke:
    needs: classify
    if: needs.classify.outputs.run_core == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: checks
          save-if: ${{ github.event_name == 'push' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: cargo build --release --locked --features embed-ui
      - name: Stamp verified-release package generation
        run: |
          chmod +x packaging/stamp-binary.sh
          packaging/stamp-binary.sh \
            --binary target/release/solodock \
            --generation verified-release-v1
      - run: chmod +x scripts/smoke-embedded-http.sh && scripts/smoke-embedded-http.sh target/release/solodock
      - run: chmod +x packaging/install.sh packaging/solodock-backup packaging/solodock-restore packaging/solodock-update packaging/stage-package.sh packaging/verify-package.sh packaging/smoke-test.sh && packaging/smoke-test.sh
      - run: chmod +x packaging/verify-unit.sh && packaging/verify-unit.sh
      - name: Measure short control-plane resource smoke
        env:
          SOLODOCK_MEASURE_WARMUP_SECONDS: "1"
          SOLODOCK_MEASURE_SAMPLE_SECONDS: "5"
        run: |
          chmod +x scripts/measure-resources.sh
          scripts/measure-resources.sh target/release/solodock "$RUNNER_TEMP/resource-report.json"
      - name: Stage package artifact
        if: github.event_name == 'push'
        run: |
          package="$RUNNER_TEMP/solodock-package"
          chmod +x packaging/stage-package.sh
          packaging/stage-package.sh \
            --binary target/release/solodock \
            --output "$package" \
            --source-sha "$GITHUB_SHA" \
            --version "main-${GITHUB_SHA:0:12}" \
            --channel main \
            --resource-report "$RUNNER_TEMP/resource-report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push'
        with:
          name: solodock-embedded-package
          path: |
            ${{ runner.temp }}/solodock-package
            ${{ runner.temp }}/resource-report.json
          retention-days: 30

  attest-package:
    needs: package-smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solodock-embedded-package
          path: ${{ runner.temp }}/attested-package
      - name: Attest package checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/attested-package/solodock-package/SHA256SUMS

  security-policy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test workflow policy checker
        run: bash scripts/check-workflow-security-test.sh
      - name: Test release tag gate
        run: bash scripts/check-release-tag-test.sh
      - name: Test CI routing and gate
        run: bash scripts/check-ci-routing-test.sh
      - name: Enforce workflow security policy
        run: bash scripts/check-workflow-security.sh
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
      - name: Install cargo-deny
        env:
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          directory="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          archive="$RUNNER_TEMP/$directory.tar.gz"
          tool_dir="$RUNNER_TEMP/cargo-deny"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${directory}.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$CARGO_DENY_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$tool_dir"
          tar -xzf "$archive" -C "$tool_dir" --strip-components=1 "$directory/cargo-deny"
          "$tool_dir/cargo-deny" --version
      - name: Check Rust advisories, licenses, bans, and sources
        run: "$RUNNER_TEMP/cargo-deny/cargo-deny check --hide-inclusion-graph advisories licenses bans sources"

  docker-e2e:
    needs: classify
    if: needs.classify.outputs.run_docker_e2e == 'true'
    runs-on: ubuntu-24.04
    services:
      docker:
        image: docker:28.5.2-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        ports:
          - 2375:2375
          - 5000:5000
        options: >-
          --privileged
          --volume ${{ github.workspace }}:${{ github.workspace }}
          --health-cmd "docker info"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DOCKER_HOST: tcp://127.0.0.1:2375
      SOLODOCK_TEST_DOCKER_HOST: tcp://127.0.0.1:2375
      SOLODOCK_E2E_SHARED_FIXTURE_ROOT: ${{ github.workspace }}/.solodock-e2e-fixtures
      SOLODOCK_E2E_STREAM_HOLD_SECONDS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: checks
          save-if: false
      - name: Lint Docker E2E target
        run: cargo clippy --features docker-e2e --test docker_e2e -- -D warnings
      - name: Assert Docker 28 classic image store
        run: |
          driver_status=$(docker info --format '{{json .DriverStatus}}')
          if [[ $driver_status == *io.containerd.snapshotter.v1* ]]; then
            echo "expected classic image store, got: $driver_status" >&2
            exit 1
          fi
      - run: docker pull alpine:3.20
      - run: docker pull nginx:1.27-alpine
      - run: docker pull nginxinc/nginx-unprivileged:1.27-alpine
      - run: docker pull registry:2
      - name: Run isolated Docker E2E with short resource smoke
        env:
          SOLODOCK_E2E_RESOURCE_REPORT: ${{ runner.temp }}/docker-e2e-resource-report.json
        run: |
          chmod +x scripts/measure-dind-daemon.sh
          scripts/measure-dind-daemon.sh '${{ job.services.docker.id }}' "$RUNNER_TEMP/docker-daemon-resource-report.json" -- \
            cargo test --features docker-e2e --test docker_e2e -- --ignored --nocapture --test-threads=2 --skip containerd_
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: solodock-docker-e2e-resource-report
          path: |
            ${{ runner.temp }}/docker-e2e-resource-report.json
            ${{ runner.temp }}/docker-daemon-resource-report.json
          if-no-files-found: error
          retention-days: 14

  docker-containerd-e2e:
    needs: classify
    if: needs.classify.outputs.run_docker_e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      docker:
        image: docker:29.7.2-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        ports:
          - 2375:2375
        options: >-
          --privileged
          --health-cmd "docker info"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DOCKER_HOST: tcp://127.0.0.1:2375
      SOLODOCK_TEST_DOCKER_HOST: tcp://127.0.0.1:2375
      SOLODOCK_EXPECT_CONTAINERD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: checks
          save-if: false
      - name: Assert Docker 29 containerd image store
        run: |
          driver_status=$(docker info --format '{{json .DriverStatus}}')
          if [[ $driver_status != *io.containerd.snapshotter.v1* ]]; then
            echo "expected io.containerd.snapshotter.v1, got: $driver_status" >&2
            exit 1
          fi
      - run: docker pull postgres:16-alpine
      - run: docker pull alpine:3.20
      - name: Run containerd identity and compensation suite
        run: >-
          cargo test --features docker-e2e --test docker_e2e
          containerd_ --
          --ignored --nocapture --test-threads=1

  ci-gate:
    if: always()
    needs:
      - classify
      - web
      - rust-lint
      - rust-test
      - package-smoke
      - attest-package
      - security-policy
      - docker-e2e
      - docker-containerd-e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require every CI branch to succeed or skip safely
        env:
          RUN_CORE: ${{ needs.classify.outputs.run_core }}
          RUN_DOCKER_E2E: ${{ needs.classify.outputs.run_docker_e2e }}
          EVENT_NAME: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: scripts/check-ci-gate.sh "$RUN_CORE" "$RUN_DOCKER_E2E" "$EVENT_NAME" "$NEEDS_JSON"
