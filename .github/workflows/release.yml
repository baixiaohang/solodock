name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-02
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release
          save-if: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify tag matches Cargo package version
        run: |
          chmod +x scripts/check-release-tag.sh
          scripts/check-release-tag.sh "$GITHUB_REF_NAME"
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: cargo build --release --locked --features embed-ui
      - name: Stamp verified-release package generation
        run: |
          chmod +x packaging/stamp-binary.sh
          packaging/stamp-binary.sh \
            --binary target/release/solodock \
            --generation verified-release-v1
      - name: Verify embedded UI and package helpers
        run: |
          chmod +x scripts/smoke-embedded-http.sh packaging/*.sh packaging/solodock-backup packaging/solodock-restore packaging/solodock-update
          scripts/smoke-embedded-http.sh target/release/solodock
          packaging/smoke-test.sh
          packaging/verify-unit.sh
      - name: Stage release assets
        run: |
          release_dir="$RUNNER_TEMP/release"
          package_dir="$RUNNER_TEMP/solodock-package"
          version=${GITHUB_REF_NAME#v}
          asset="solodock-${GITHUB_REF_NAME}-ubuntu-24.04-x86_64.tar.gz"
          mkdir -p "$release_dir"
          packaging/stage-package.sh \
            --binary target/release/solodock \
            --output "$package_dir" \
            --source-sha "$GITHUB_SHA" \
            --version "$version" \
            --channel stable
          (cd "$RUNNER_TEMP" && tar -czf "$release_dir/$asset" solodock-package)
          printf '%s\n' "$GITHUB_SHA" >"$release_dir/SOURCE_SHA"
          (cd "$release_dir" && sha256sum "$asset" SOURCE_SHA >SHA256SUMS)
          mkdir "$RUNNER_TEMP/release-smoke"
          tar -xzf "$release_dir/$asset" -C "$RUNNER_TEMP/release-smoke"
          (cd "$RUNNER_TEMP/release-smoke/solodock-package" && sha256sum -c SHA256SUMS)
          test "$(cat "$RUNNER_TEMP/release-smoke/solodock-package/SOURCE_SHA")" = "$GITHUB_SHA"
          test "$(cat "$RUNNER_TEMP/release-smoke/solodock-package/VERSION")" = "$version"
          grep -qx 'CHANNEL=stable' "$RUNNER_TEMP/release-smoke/solodock-package/INSTALL_MANIFEST"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solodock-release-package
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  attest-release:
    needs: build-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solodock-release-package
          path: ${{ runner.temp }}/release
      - name: Attest release checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/SHA256SUMS

  publish-release:
    needs: [build-release, attest-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: solodock-release-package
          path: ${{ runner.temp }}/release
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_dir="$RUNNER_TEMP/release"
          asset="solodock-${GITHUB_REF_NAME}-ubuntu-24.04-x86_64.tar.gz"
          gh release create "$GITHUB_REF_NAME" \
            "$release_dir/$asset" \
            "$release_dir/SHA256SUMS" \
            "$release_dir/SOURCE_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
